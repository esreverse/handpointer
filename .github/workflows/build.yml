name: Build

# Releases and everyday builds happen locally (scripts/build-local.sh, scripts/release.sh).
# This only checks pull requests from others, or runs by hand from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64
